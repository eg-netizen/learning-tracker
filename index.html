<script>(function(){try{var c=document.createElement("canvas");c.width=c.height=180;var x=c.getContext("2d");x.fillStyle="#7a3ff0";x.fillRect(0,0,180,180);x.fillStyle="#ffd23f";x.beginPath();x.arc(90,90,63,0,7);x.fill();x.fillStyle="#3b2a00";x.font="bold 100px sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText("\u00d7",90,96);document.getElementById("ti").href=c.toDataURL("image/png");}catch(e){}})();</script>
